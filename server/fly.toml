# fly.toml app configuration file generated for dojo-matchmaker on 2026-11-23T19:36:10-07:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'dojo-matchmaker'
primary_region = 'yyz'

[build]
  dockerfile = 'Dockerfile'

[[services]]
  protocol = 'udp'
  internal_port = 7777
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7777

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
